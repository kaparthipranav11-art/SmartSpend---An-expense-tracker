<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Budgets - SmartSpend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">SmartSpend</a>
            <div class="d-flex">
                <a href="/expenses" class="btn btn-outline-light me-2">Expenses</a>
                <a href="/accounts" class="btn btn-outline-light me-2">Accounts</a>
                <a href="/dashboard" class="btn btn-outline-light me-2">Dashboard</a>
                <a href="/history" class="btn btn-outline-light me-2">History</a>
                <a href="/login" class="btn btn-outline-light me-2">Login</a>
                <a href="/register" class="btn btn-outline-light me-2">Register</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Monthly Budget Limits</h2>
        
        <div th:if="${param.success}" class="alert alert-success">Budget limit set successfully!</div>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm border-warning">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0">Set Category Budget</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/budgets/add}" method="post">
                            <div class="mb-3">
                                <label>Category</label>
                                <select name="categoryId" class="form-select" required>
                                    <option th:each="cat : ${categories}" th:if="${cat.categoryType.name() == 'EXPENSE'}" th:value="${cat.categoryId}" th:text="${cat.categoryName}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label>Monthly Limit (₹)</label>
                                <input type="number" step="0.01" min="1" name="monthlyLimit" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 text-dark fw-bold">Save Budget</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Category</th><th>Monthly Limit</th><th>Spent</th><th>Progress</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="b : ${budgets}">
                                    <td class="fw-bold" th:text="${b.category.categoryName}"></td>
                                    <td th:text="${'₹' + b.monthlyLimit}"></td>
                                    <td th:text="${'₹' + spentMap[b.budgetId]}"></td>
                                    <td style="width: 30%;">
                                        <!-- Dynamic Bootstrap Progress Bar -->
                                        <div class="progress" style="height: 20px;">
                                            <div class="progress-bar" 
                                                 role="progressbar" 
                                                 th:style="'width: ' + ${percentageMap[b.budgetId]} + '%;'"
                                                 th:classappend="${percentageMap[b.budgetId] > 100 ? 'bg-danger' : (percentageMap[b.budgetId] > 80 ? 'bg-warning text-dark' : 'bg-success')}"
                                                 th:text="${percentageMap[b.budgetId] + '%'}">
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(budgets)}">
                                    <td colspan="4" class="text-center text-muted">No budgets configured yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
