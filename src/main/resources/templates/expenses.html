<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expenses - SmartSpend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">SmartSpend</a>
            <div class="d-flex">
                <a href="/accounts" class="btn btn-outline-light me-2">Accounts</a>
                <a href="/dashboard" class="btn btn-outline-light me-2">Dashboard</a>
                <a href="/history" class="btn btn-outline-light me-2">History</a>
                <a href="/login" class="btn btn-outline-light me-2">Login</a>
                <a href="/register" class="btn btn-outline-light me-2">Register</a>
                <a href="/budgets" class="btn btn-outline-light me-2">Budgets</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Log & Track Expenses</h2>
        
        <div th:if="${param.success}" class="alert alert-success">Expense successfully logged and balance updated!</div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="row">
            <!-- Add Expense Form -->
            <div class="col-md-4">
                <div class="card shadow-sm border-danger">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">Log New Expense</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/expenses/add}" method="post">
                            
                            <div class="mb-3">
                                <label>Amount (₹)</label>
                                <input type="number" step="0.01" min="0.01" name="amount" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label>Pay From Account</label>
                                <select name="accountId" class="form-select" required>
                                    <option value="" disabled selected>Select an account...</option>
                                    <option th:each="acc : ${accounts}" th:value="${acc.accountId}" th:text="${acc.accountName + ' (Balance: ₹' + acc.balance + ')'}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label>Category</label>
                                <select name="categoryId" class="form-select" required>
                                    <option th:each="cat : ${categories}" th:if="${cat.categoryType.name() == 'EXPENSE'}" th:value="${cat.categoryId}" th:text="${cat.categoryName}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label>Payment Method</label>
                                <select name="paymentMethod" class="form-select" required>
                                    <option value="UPI_SIMULATED">UPI (Simulated)</option>
                                    <option value="CARD">Debit/Credit Card</option>
                                    <option value="CASH">Cash</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label>Description</label>
                                <input type="text" name="description" class="form-control" placeholder="e.g. Swiggy Order" required>
                            </div>

                            <button type="submit" class="btn btn-danger w-100">Deduct & Save Expense</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Expense History -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Category</th>
                                    <th>Description</th>
                                    <th>Account Used</th>
                                    <th>Method</th>
                                    <th class="text-danger">Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="exp : ${expenses}">
                                    <td th:text="${exp.expenseDate}"></td>
                                    <td><span class="badge bg-secondary" th:text="${exp.category.categoryName}"></span></td>
                                    <td th:text="${exp.description}"></td>
                                    <td th:text="${exp.account.accountName}"></td>
                                    <td th:text="${exp.paymentMethod}"></td>
                                    <td class="text-danger fw-bold" th:text="${'-₹' + exp.amount}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(expenses)}">
                                    <td colspan="6" class="text-center text-muted">No expenses recorded yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
