<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Accounts - SmartSpend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">SmartSpend</a>
            <div class="d-flex">
                <a href="/dashboard" class="btn btn-outline-light me-2">Dashboard</a>
                <a href="/expenses" class="btn btn-outline-light me-2">Expenses</a>
                <a href="/history" class="btn btn-outline-light me-2">History</a>
                <a href="/login" class="btn btn-outline-light me-2">Login</a>
                <a href="/register" class="btn btn-outline-light me-2">Register</a>
                <a href="/budgets" class="btn btn-outline-light me-2">Budgets</a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-danger btn-sm" type="submit">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">My Simulated Bank Accounts</h2>
        
        <div th:if="${param.success}" class="alert alert-success">Account successfully created!</div>

        <div class="row">
            <!-- Add Account Form -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Add New Account</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/accounts/add}" method="post">
                            <div class="mb-3">
                                <label>Account Name</label>
                                <input type="text" name="accountName" class="form-control" placeholder="e.g. Student Savings" required>
                            </div>
                            <div class="mb-3">
                                <label>Account Type</label>
                                <select name="accountType" class="form-select" required>
                                    <option value="SAVINGS">Savings Account</option>
                                    <option value="CURRENT">Current Account</option>
                                    <option value="WALLET">Digital Wallet</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label>Initial Balance (₹)</label>
                                <input type="number" step="0.01" min="0" name="initialBalance" class="form-control" value="0.00" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Create Account</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- List of Accounts -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Account Name</th>
                                    <th>Account Number</th>
                                    <th>Type</th>
                                    <th>Balance</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="acc : ${accounts}">
                                    <td class="fw-bold" th:text="${acc.accountName}"></td>
                                    <td th:text="${acc.accountNumber}"></td>
                                    <td th:text="${acc.accountType}"></td>
                                    <td class="text-success fw-bold" th:text="${'₹' + acc.balance}"></td>
                                    <td><span class="badge bg-success" th:text="${acc.status}"></span></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(accounts)}">
                                    <td colspan="5" class="text-center text-muted">You haven't created any accounts yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
