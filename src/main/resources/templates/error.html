<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error - SmartSpend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm text-center p-4" style="max-width: 400px;">
        <div class="card-body">
            <h1 class="text-danger fw-bold display-4">Oops!</h1>
            <h5 class="card-title mt-3">Something went wrong</h5>
            <p class="text-muted small mt-2">An unexpected error occurred while processing your request.</p>
            <a href="/dashboard" class="btn btn-primary w-100 mt-3">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
