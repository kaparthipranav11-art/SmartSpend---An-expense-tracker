<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transaction History - SmartSpend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">SmartSpend</a>
            <div class="d-flex">
                <a href="/expenses" class="btn btn-outline-light me-2">Expenses</a>
                <a href="/incomes" class="btn btn-outline-light me-2">Incomes</a>
                <a href="/budgets" class="btn btn-outline-light me-2">Budgets</a>
                <a href="/dashboard" class="btn btn-outline-light">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Complete Transaction Activity Feed</h2>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Category / Source</th>
                            <th>Description</th>
                            <th>Account</th>
                            <th class="text-end">Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="tx : ${transactions}">
                            <td th:text="${tx.date}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${tx.type == 'INCOME' ? 'bg-success' : 'bg-danger'}" 
                                      th:text="${tx.type}">
                                </span>
                            </td>
                            <td class="fw-bold" th:text="${tx.category}"></td>
                            <td th:text="${tx.description}"></td>
                            <td th:text="${tx.accountName}"></td>
                            <td class="text-end fw-bold" 
                                th:classappend="${tx.type == 'INCOME' ? 'text-success' : 'text-danger'}"
                                th:text="${(tx.type == 'INCOME' ? '+₹' : '-₹') + tx.amount}">
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(transactions)}">
                            <td colspan="6" class="text-center text-muted py-4">No transaction history found yet. Start logging expenses or incomes!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
